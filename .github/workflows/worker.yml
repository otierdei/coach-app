name: Deploy push worker
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

concurrency: worker-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.149.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Crypto tests (RFC 8291 test vector, VAPID, round trip)
        run: node test/webpush.test.mjs

      - name: Find or create the D1 database (EU jurisdiction)
        run: |
          id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const d=a.find(x=>x.name==="coach-push");process.stdout.write(d?d.uuid:"")})')
          if [ -z "$id" ]; then
            $WRANGLER d1 create coach-push --jurisdiction=eu
            id=$($WRANGLER d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const d=a.find(x=>x.name==="coach-push");process.stdout.write(d?d.uuid:"")})')
          fi
          test -n "$id"
          sed -i "s/__D1_ID__/$id/" wrangler.toml
          echo "D1 database id: $id"
          $WRANGLER d1 info coach-push || true

      - name: Apply migrations
        run: $WRANGLER d1 migrations apply coach-push --remote

      - name: Deploy
        run: $WRANGLER deploy 2>&1 | tee deploy.log

      - name: Smoke test
        run: |
          url=$(grep -oE 'https://coach-push\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker URL: $url"
          test -n "$url"
          for i in 1 2 3 4 5 6; do
            out=$(curl -fsS "$url/health") && break || sleep 5
          done
          echo "$out"
          echo "$out" | grep -q '"ok":true'
          curl -fsS "$url/vapid" | grep -q publicKey
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -d '{"key":"wrong"}' "$url/status")
          echo "status with wrong key: $code"
          test "$code" = "401"
